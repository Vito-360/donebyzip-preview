<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><div style="max-width:68ch;display:grid;gap:36px"><header style="display:grid;gap:16px"><p class="pill-eyebrow">Privacy</p><h1 class="t-h2">Privacy policy</h1><p class="t-lede">What data we collect when you get in touch, why, and how long we keep it.</p></header><section style="display:grid;gap:10px"><h2 class="t-h3">Who is responsible</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>The data controller is <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[BUSINESS NAME]</span>, owned by <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[FULL NAME]</span>, <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[ADDRESS]</span>, OIB <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[OIB]</span>. For any question about your data, email info@donebyzip.com or call +385 98 183 4111.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">What we collect</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><ul style='list-style:disc;padding-left:1.2rem;display:grid;gap:6px'><li><b>Contact form:</b> your name, email address and message.</li><li><b>WhatsApp, email and calls:</b> what you send us yourself, such as your name, phone number and website address.</li><li><b>Booking a call (Cal.com):</b> your name, email and the time you pick.</li></ul><p>We don’t ask for sensitive data, so please don’t send any.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Why we use it</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Only to reply to your enquiry, run the free check and send a proposal. The legal basis is taking steps at your request before entering a contract (Art. 6(1)(b) GDPR) and our legitimate interest in replying to a message you sent (Art. 6(1)(f)). We don’t send newsletters and don’t use your data for advertising.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Who else processes it</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>We use outside services that process data for us: Formspree (contact form), Cal.com (booking calls), WhatsApp / Meta (if you message us there), Google Workspace (email) and Vercel (hosting). Some of them may transfer data outside the EU, with GDPR safeguards such as the EU–US Data Privacy Framework or standard contractual clauses. <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[check this list before publishing]</span></p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">How long we keep it</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Enquiries that don’t turn into work are deleted no later than <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[12 months]</span> after the last contact. If we work together, we keep data for as long as accounting and tax rules require.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Cookies</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>This site doesn’t use cookies for analytics or advertising. <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[if you add analytics, update this section]</span></p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Your rights</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>You can ask to access, correct or delete your data, restrict or object to its processing, and receive it in a portable format. Just email info@donebyzip.com. If you think we process your data unlawfully, you can complain to the Croatian data protection authority, AZOP (azop.hr).</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Changes</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>If we change this policy, the new version will be published on this page. Last updated: 1 October 2026.</p></div></section></div></div></main>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><div style="max-width:68ch;display:grid;gap:36px"><header style="display:grid;gap:16px"><p class="pill-eyebrow">Privatnost</p><h1 class="t-h2">Politika privatnosti</h1><p class="t-lede">Koje podatke prikupljamo kad nam se javite, zašto i koliko dugo ih čuvamo.</p></header><section style="display:grid;gap:10px"><h2 class="t-h3">Tko je voditelj obrade</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Voditelj obrade je <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[NAZIV OBRTA]</span>, vl. <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[IME I PREZIME]</span>, <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[ADRESA]</span>, OIB <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[OIB]</span>. Za sva pitanja o podacima pišite na info@donebyzip.com ili nazovite +385 98 183 4111.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Koje podatke prikupljamo</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><ul style='list-style:disc;padding-left:1.2rem;display:grid;gap:6px'><li><b>Obrazac za kontakt:</b> ime, e-mail adresa i poruka koju napišete.</li><li><b>WhatsApp, e-mail i poziv:</b> podaci koje nam sami pošaljete, npr. ime, broj telefona i adresa vaše web stranice.</li><li><b>Dogovor termina (Cal.com):</b> ime, e-mail i odabrani termin.</li></ul><p>Ne tražimo osjetljive podatke i molimo da ih ne šaljete.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Zašto ih koristimo</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Isključivo da odgovorimo na vaš upit, napravimo besplatnu provjeru i pošaljemo ponudu. Pravna osnova je poduzimanje radnji na vaš zahtjev prije sklapanja ugovora (čl. 6. st. 1. t. (b) GDPR-a) i naš legitimni interes da odgovorimo na poruku koju ste poslali (čl. 6. st. 1. t. (f)). Ne šaljemo newsletter i ne koristimo vaše podatke za oglašavanje.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Tko ih još obrađuje</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Koristimo vanjske usluge koje podatke obrađuju za nas: Formspree (slanje obrasca), Cal.com (dogovor termina), WhatsApp / Meta (ako nam pišete na WhatsApp), Google Workspace (e-mail) i Vercel (hosting stranice). Neke od njih podatke mogu prenijeti izvan EU-a, uz zaštitne mjere propisane GDPR-om, poput EU–SAD okvira za privatnost podataka ili standardnih ugovornih klauzula. <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[provjerite popis usluga prije objave]</span></p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Koliko dugo ih čuvamo</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Upite koji ne postanu suradnja brišemo najkasnije <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[12 mjeseci]</span> nakon zadnjeg kontakta. Ako surađujemo, podatke čuvamo onoliko koliko propisi o računovodstvu i porezu traže.</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Kolačići</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Ova stranica ne koristi kolačiće za analitiku ni oglašavanje. <span style="background:#c8ff3d33;color:var(--color-fg);padding:0 4px;border-radius:4px">[ako uvedete analitiku, ovaj odlomak treba promijeniti]</span></p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Vaša prava</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Imate pravo zatražiti pristup svojim podacima, njihov ispravak, brisanje ili ograničenje obrade, prigovoriti obradi i dobiti podatke u prenosivom obliku. Dovoljno je pisati na info@donebyzip.com. Ako smatrate da podatke obrađujemo protivno propisima, možete podnijeti pritužbu Agenciji za zaštitu osobnih podataka (azop.hr).</p></div></section><section style="display:grid;gap:10px"><h2 class="t-h3">Izmjene</h2><div class="text-fg-2" style="display:grid;gap:10px;font-size:1rem;line-height:1.65"><p>Ako promijenimo ovu politiku, nova verzija bit će objavljena na ovoj stranici. Zadnja izmjena: 1. listopada 2026.</p></div></section></div></div></main>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><div style="max-width:72ch;display:grid;gap:28px"><header style="display:grid;gap:18px"><p class="pill-eyebrow">Izrada web stranica</p><h1 class="t-h2">Izrada web stranica za male tvrtke</h1><p class="t-lede">Za obrte i male tvrtke koje još nemaju stranicu, ili imaju samo Facebook i Google profil. Napravimo stranicu koja se brzo otvara na mobitelu, povezana je s vašim Google profilom i vodi posjetitelja do upita.</p><div style="display:flex;flex-wrap:wrap;gap:12px"><a href="https://wa.me/385981834111?text=Dobar%20dan!%20%C5%BDelim%20besplatnu%20provjeru%20stranice.%20Moja%20stranica%3A%20" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg w-full sm:w-fit">Besplatna provjera na WhatsAppu</a><a href="#/hr/radovi" class="btn btn-glass glass btn-lg w-full sm:w-fit">Pogledajte radove</a></div></header><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Za koga je</h2><ul style="display:grid;gap:10px;margin:0;padding:0;list-style:none"><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Nemate stranicu, a ljudi vas traže na Googleu po usluzi i mjestu.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Klijenti vas nalaze samo preko Facebooka ili Instagrama.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Imate Google profil, ali on ne vodi nikamo.</span></li></ul></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Što dobivate</h2><ul style="display:grid;gap:10px;margin:0;padding:0;list-style:none"><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Dizajn i izrada, brza na mobitelu.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Obrazac za upite ili sustav za rezervacije, ovisno o tome kako radite.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Povezan Google Business profil.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Analitika, da vidite što stranica donosi.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Sve u vašem vlasništvu: datoteke, računi i pristup svemu.</span></li></ul></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Kako radi</h2><ol style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px;margin:0;padding:0;list-style:none"><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">01<b style="background:var(--color-accent);color:#000;border-radius:999px;padding:1px 8px;font-size:.6875rem;font-weight:600">Besplatno</b></span><h3 class="t-h3">Besplatna provjera</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Pošaljite adresu stranice ili Google profila. Tri nalaza dobijete napismeno, bez ikakve obveze.</p></li><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">02</span><h3 class="t-h3">Ponuda napismeno</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Opseg, rok i cijena napismeno prije početka rada. Bez skrivenih troškova.</p></li><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">03</span><h3 class="t-h3">Izrada i predaja</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Vidite svaki korak. Na kraju sve prelazi u vaše vlasništvo: datoteke, računi i pristup svemu.</p></li></ol></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Primjer</h2><p class="text-fg-2" style="line-height:1.65"><a class="text-fg underline" href="#/hr/radovi#apartments-grbic">Apartments Grbić</a>: stranica za smještaj kod Dubrovnika izgrađena oko jedne radnje, provjeri dostupnost pa rezerviraj. <a class="text-fg underline" href="#/hr/radovi">Svi radovi</a></p></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Pitanja</h2><div style="display:grid;gap:18px"><div style="display:grid;gap:6px"><h3 class="t-h3">Koliko košta izrada web stranice?</h3><p class="text-fg-2" style="line-height:1.65">Ovisi o četiri stvari: broju stranica, trebate li rezervacije ili obrazac za upite, tko piše tekstove i na koliko jezika. Točan iznos dobijete napismeno nakon besplatne provjere, prije bilo kakvog posla.</p></div><div style="display:grid;gap:6px"><h3 class="t-h3">Koliko traje izrada?</h3><p class="text-fg-2" style="line-height:1.65">Rok dobijete napismeno, zajedno s ponudom.</p></div><div style="display:grid;gap:6px"><h3 class="t-h3">Moram li sam pisati tekstove?</h3><p class="text-fg-2" style="line-height:1.65">Ne morate. Tekstove možemo napisati mi, na hrvatskom ili engleskom.</p></div></div></section><section class="" style="display:grid;gap:16px;"><h2 class="t-h3" style="font-size:1.25rem">Imate stranicu koja ne radi?</h2><p class="text-fg-2" style="line-height:1.65">Pogledajte <a class="text-fg underline" href="#/hr/redizajn-web-stranice">redizajn web stranice</a>.</p></section></div></div></main>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><div style="max-width:72ch;display:grid;gap:28px"><header style="display:grid;gap:18px"><p class="pill-eyebrow">Redizajn web stranice</p><h1 class="t-h2">Redizajn web stranice</h1><p class="t-lede">Imate stranicu, ali ne donosi upite? Prvo besplatno provjerimo što je koči, pa vam napismeno kažemo isplati li se popraviti postojeću ili napraviti novu.</p><div style="display:flex;flex-wrap:wrap;gap:12px"><a href="https://wa.me/385981834111?text=Dobar%20dan!%20%C5%BDelim%20besplatnu%20provjeru%20stranice.%20Moja%20stranica%3A%20" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg w-full sm:w-fit">Besplatna provjera na WhatsAppu</a><a href="#/hr/radovi" class="btn btn-glass glass btn-lg w-full sm:w-fit">Pogledajte radove</a></div></header><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Znakovi da stranica treba redizajn</h2><ul style="display:grid;gap:10px;margin:0;padding:0;list-style:none"><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Sporo se otvara na mobitelu.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Posjetitelj ne zna gdje kliknuti da vas kontaktira.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Izgleda zastarjelo, pa djeluje kao da ne radite.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Ne pojavljuje se na Googleu kad vas traže po usluzi i mjestu.</span></li></ul></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Što provjeravamo</h2><ul style="display:grid;gap:10px;margin:0;padding:0;list-style:none"><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span><b>Google profil:</b> vodi li ljude na vašu stranicu.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span><b>Stranicu:</b> pokazuje li u nekoliko sekundi da ste pravi izbor.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span><b>Put do upita:</b> može li posjetitelj bez muke poslati upit ili rezervirati.</span></li></ul></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Popraviti ili napraviti novu?</h2><p class="text-fg-2" style="line-height:1.65">Ako je temelj dobar, popravimo ono što koči. Ako nije, nova stranica često je jeftinija od krpanja stare. U oba slučaja odluku donosite vi, na temelju pisanih nalaza.</p></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Kako radi</h2><ol style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px;margin:0;padding:0;list-style:none"><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">01<b style="background:var(--color-accent);color:#000;border-radius:999px;padding:1px 8px;font-size:.6875rem;font-weight:600">Besplatno</b></span><h3 class="t-h3">Besplatna provjera</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Pošaljite adresu stranice ili Google profila. Tri nalaza dobijete napismeno, bez ikakve obveze.</p></li><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">02</span><h3 class="t-h3">Ponuda napismeno</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Opseg, rok i cijena napismeno prije početka rada. Bez skrivenih troškova.</p></li><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">03</span><h3 class="t-h3">Izrada i predaja</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Vidite svaki korak. Na kraju sve prelazi u vaše vlasništvo: datoteke, računi i pristup svemu.</p></li></ol></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Pitanja</h2><div style="display:grid;gap:18px"><div style="display:grid;gap:6px"><h3 class="t-h3">Koliko košta izrada web stranice?</h3><p class="text-fg-2" style="line-height:1.65">Ovisi o četiri stvari: broju stranica, trebate li rezervacije ili obrazac za upite, tko piše tekstove i na koliko jezika. Točan iznos dobijete napismeno nakon besplatne provjere, prije bilo kakvog posla.</p></div><div style="display:grid;gap:6px"><h3 class="t-h3">Hoću li izgubiti pozicije na Googleu?</h3><p class="text-fg-2" style="line-height:1.65">Pazimo na to. Stare adrese preusmjeravamo na nove, pa ni Google ni posjetitelji ne završe na praznoj stranici.</p></div><div style="display:grid;gap:6px"><h3 class="t-h3">Ostaje li mi domena?</h3><p class="text-fg-2" style="line-height:1.65">Da. Domena je vaša, a na kraju sve prelazi u vaše vlasništvo: datoteke, računi i pristup svemu.</p></div></div></section><section class="" style="display:grid;gap:16px;"><h2 class="t-h3" style="font-size:1.25rem">Još nemate stranicu?</h2><p class="text-fg-2" style="line-height:1.65">Pogledajte <a class="text-fg underline" href="#/hr/izrada-web-stranica">izradu web stranica</a>.</p></section></div></div></main>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><div style="max-width:72ch;display:grid;gap:28px"><header style="display:grid;gap:18px"><p class="pill-eyebrow">Small business websites</p><h1 class="t-h2">Websites for small businesses</h1><p class="t-lede">For small businesses that don’t have a website yet, or only have Facebook and a Google profile. We build a site that loads fast on a phone, connects to your Google profile and leads visitors to get in touch.</p><div style="display:flex;flex-wrap:wrap;gap:12px"><a href="https://wa.me/385981834111?text=Hello!%20I'd%20like%20the%20free%20website%20check.%20My%20site%3A%20" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg w-full sm:w-fit">Free check on WhatsApp</a><a href="#/work" class="btn btn-glass glass btn-lg w-full sm:w-fit">See the work</a></div></header><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Who it’s for</h2><ul style="display:grid;gap:10px;margin:0;padding:0;list-style:none"><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>You don’t have a website, and people search for your service and town on Google.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Customers only find you through Facebook or Instagram.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>You have a Google profile, but it doesn’t lead anywhere.</span></li></ul></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">What you get</h2><ul style="display:grid;gap:10px;margin:0;padding:0;list-style:none"><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Design and build, fast on a phone.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>An enquiry form or a booking system, depending on how you work.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Your Google Business profile linked.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Analytics, so you see what the site brings in.</span></li><li style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);margin-top:.6em"></span><span>Everything is yours: files, accounts and access.</span></li></ul></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">How it works</h2><ol style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px;margin:0;padding:0;list-style:none"><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">01<b style="background:var(--color-accent);color:#000;border-radius:999px;padding:1px 8px;font-size:.6875rem;font-weight:600">Free</b></span><h3 class="t-h3">The free check</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Send us your website or Google profile. You get three findings in writing, with no obligation.</p></li><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">02</span><h3 class="t-h3">A proposal in writing</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">Scope, timeline and price, agreed in writing before any work begins. No hidden costs.</p></li><li style="display:grid;gap:6px;align-content:start"><span class="tnum text-fg-3" style="display:flex;gap:8px;align-items:center;font-size:.8125rem">03</span><h3 class="t-h3">Build and hand over</h3><p class="text-fg-2" style="font-size:.9375rem;line-height:1.55">You see it at every stage. At launch you get full ownership: files, accounts, access to everything.</p></li></ol></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Example</h2><p class="text-fg-2" style="line-height:1.65"><a class="text-fg underline" href="#/work#apartments-grbic">Apartments Grbić</a>: a site for holiday apartments near Dubrovnik, built around one action, check availability, then book. <a class="text-fg underline" href="#/work">All work</a></p></section><section class="card " style="display:grid;gap:16px;padding:24px"><h2 class="t-h3" style="font-size:1.25rem">Questions</h2><div style="display:grid;gap:18px"><div style="display:grid;gap:6px"><h3 class="t-h3">How much does a website cost?</h3><p class="text-fg-2" style="line-height:1.65">It depends on four things: how many pages, whether you need bookings or an enquiry form, who writes the copy, and how many languages. You get the exact amount in writing after the free check, before any work starts.</p></div><div style="display:grid;gap:6px"><h3 class="t-h3">How long does it take?</h3><p class="text-fg-2" style="line-height:1.65">You get the timeline in writing, with the proposal.</p></div><div style="display:grid;gap:6px"><h3 class="t-h3">Do I have to write the copy?</h3><p class="text-fg-2" style="line-height:1.65">No. We can write it for you, in Croatian or English.</p></div></div></section><section class="" style="display:grid;gap:16px;"><h2 class="t-h3" style="font-size:1.25rem">Have a site that doesn’t work?</h2><p class="text-fg-2" style="line-height:1.65">See <a class="text-fg underline" href="#/website-redesign">website redesign</a>.</p></section></div></div></main>

es. The domain is yours, and at launch you get full ownership: files, accounts, access to everything.</p></div></div></section><section class="" style="display:grid;gap:16px;"><h2 class="t-h3" style="font-size:1.25rem">No website yet?</h2><p class="text-fg-2" style="line-height:1.65">See <a class="text-fg underline" href="#/small-business-websites">small business websites</a>.</p></section></div></div></main>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">SEO</span></p><h1 class="t-h2">7 grešaka na Google profilu zbog kojih vas kupci ne pronađu</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Google profil je često prvo što netko vidi o vašoj tvrtki, prije stranice i prije poziva. Ovo su greške koje najčešće koče male tvrtke i kako ih ispraviti za jedno popodne.</p></header><div class="zip-prose">
<p>Google kaže da lokalne rezultate određuju tri stvari: koliko profil odgovara onome što netko traži, koliko ste mu blizu i koliko je vaša tvrtka poznata. Na udaljenost ne možete utjecati, ali na ostalo dvoje možete. Prije svega: profil mora biti potvrđen, inače ga ne možete uređivati.</p>
<h2>1. Pogrešna ili preopćenita kategorija</h2>
<p>Glavna kategorija Googleu govori što radite. Odaberite najprecizniju koja postoji, npr. “Frizerski salon”, a ne “Salon ljepote” ako radite samo kosu. Ostale usluge dodajte kao sporedne kategorije.</p>
<h2>2. Profil ne vodi na stranicu, ili vodi na krivu</h2>
<p>Bez linka na web stranicu ljudi koji žele više informacija nemaju kamo. Ako link vodi na naslovnicu na kojoj nema ni broja telefona, izgubili ste ih. Neka vodi na stranicu s jasnim načinom kontakta.</p>
<h2>3. Netočno radno vrijeme</h2>
<p>Ništa ne ruši povjerenje brže od zatvorenih vrata u vrijeme kad Google kaže da radite. Upišite i posebno radno vrijeme za praznike i godišnji odmor.</p>
<h2>4. Ime, adresa i telefon se ne podudaraju</h2>
<p>Ako je na profilu jedan broj, na stranici drugi, a na Facebooku treći, zbunjeni su i ljudi i Google. Neka ime tvrtke, adresa i telefon budu napisani jednako na svim mjestima.</p>
<h2>5. Nema fotografija, ili su stare</h2>
<p>Google preporučuje fotografije i videe jer kupcima pokazuju što nudite. Dodajte stvarne fotografije prostora, tima i rada i povremeno ih osvježite.</p>
<h2>6. Recenzije bez odgovora</h2>
<p>Google preporučuje da odgovarate na recenzije. Odgovorite na svaku, i dobru i lošu, kratko i pristojno. Kupci čitaju i vaše odgovore, ne samo recenzije.</p>
<h2>7. Prazan opis i neispunjene usluge</h2>
<p>Opis i popis usluga mjesta su gdje vlastitim riječima kažete što radite i gdje. Napišite ih onako kako bi vas kupac tražio: “šišanje i bojanje kose, Trešnjevka, Zagreb”, a ne “vrhunska usluga po mjeri”.</p>
<h2>Brza provjera</h2>
<ul><li>Profil je potvrđen.</li><li>Glavna kategorija je najpreciznija moguća.</li><li>Link vodi na stranicu s brojem telefona ili obrascem.</li><li>Radno vrijeme je točno, i za praznike.</li><li>Ime, adresa i telefon su isti posvuda.</li><li>Ima stvarnih fotografija iz zadnjih nekoliko mjeseci.</li><li>Na svaku recenziju je odgovoreno.</li><li>Opis i usluge su ispunjeni riječima kojima vas kupci traže.</li></ul>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">SEO</span></p><h1 class="t-h2">Zašto vas ne nalaze na Googleu iako imate web stranicu</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Stranica postoji, plaćate domenu i hosting, a kad upišete svoju uslugu u Google, pojavljuje se svatko osim vas. Razlog je gotovo uvijek jedan od ovih pet.</p></header><div class="zip-prose">
<h2>1. Google stranicu uopće nije indeksirao</h2>
<p>Upišite u Google <b>site:vasadomena.hr</b> (sa svojom domenom). Ako se ne pojavi nijedna stranica, Google vas još nije uvrstio u rezultate. Nova stranica treba vremena, a pomaže ako je prijavite u Google Search Console i pošaljete sitemap.</p>
<h2>2. Stranica Googleu kaže da je ne prikazuje</h2>
<p>Dok se stranica radi, često se uključi postavka koja Googleu kaže da je ne prikazuje (tzv. noindex). Ako je netko zaboravi isključiti na objavi, stranica ostaje nevidljiva bez obzira na sve ostalo. Search Console to pokazuje u izvješću o indeksiranju.</p>
<h2>3. Na stranici ne piše ono što ljudi traže</h2>
<p>Ljudi traže “vodoinstalater Dubrava” ili “računovođa za obrt Zagreb”. Ako na stranici piše samo “Kvaliteta i pouzdanost od 2005.”, Google ne zna za što bi vas prikazao. Naslov stranice, glavni naslov i prvi odlomak trebaju reći što radite i gdje.</p>
<h2>4. Google profil nije povezan sa stranicom</h2>
<p>Za lokalne pretrage velik dio posla radi Google Business profil. <a class="text-fg underline" href="https://support.google.com/business/answer/7091" target="_blank" rel="noopener noreferrer">Google</a> navodi da na lokalni poredak utječe koliko profil odgovara pretrazi, udaljenost i koliko je tvrtka poznata. Profil bez linka na stranicu i stranica bez profila rade svaki napola.</p>
<h2>5. Konkurencija je jednostavno jača</h2>
<p>Ponekad je sve tehnički ispravno, ali drugi imaju više recenzija, više sadržaja i dulje su na tržištu. Tada pomaže samo strpljiv rad: točan profil, redovite recenzije i stranice za svaku glavnu uslugu.</p>
<h2>Provjera za deset minuta</h2>
<ol><li>Upišite <b>site:vasadomena.hr</b> i pogledajte ima li rezultata.</li><li>Upišite svoju uslugu i kvart ili grad i pogledajte tko se pojavljuje.</li><li>Otvorite svoju naslovnicu i provjerite piše li u prvom odlomku što radite i gdje.</li><li>Provjerite vodi li vaš Google profil na stranicu.</li></ol>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">SEO</span></p><h1 class="t-h2">Koliko stvarno traje da se stranica pojavi na Googleu</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Objavili ste stranicu i čekate. Postoje dvije različite stvari koje se miješaju: kada će vas Google uopće uvrstiti i kada će vas ljudi stvarno pronaći.</p></header><div class="zip-prose">
<h2>Uvrštavanje: dani do tjedni</h2>
<p>Google kaže da pregledavanje stranice može trajati od nekoliko dana do nekoliko tjedana, i da zahtjev za ponovni pregled ne jamči da će stranica ući u rezultate odmah, pa ni uopće. Nitko vam ne može obećati točan datum.</p>
<h2>Pozicija: obično dulje</h2>
<p>To što ste uvršteni ne znači da ste na prvoj stranici rezultata. Za pojmove gdje su konkurenti već godinama prisutni, nova stranica realno treba mjesece. Kad netko upiše točno ime vaše tvrtke, pojavit ćete se puno brže nego za opći pojam poput “izrada web stranica Zagreb”.</p>
<h2>Što možete ubrzati</h2>
<ul><li>Prijavite stranicu u Google Search Console i pošaljite sitemap.</li><li>Provjerite da stranica Googleu ne kaže da je ne prikazuje (noindex).</li><li>Povežite Google Business profil sa stranicom.</li><li>Neka svaka glavna usluga ima svoju stranicu s jasnim naslovom.</li><li>Linkajte stranicu s mjesta koja već postoje: profil, društvene mreže, imenici.</li></ul>
<h2>Što ne pomaže</h2>
<p>Ponovno slanje istog zahtjeva Googleu više puta ne ubrzava ništa, a Google kaže da za to postoje i ograničenja. Usluge koje obećavaju “prvu stranicu za tjedan dana” obično to ne mogu ispuniti.</p>
<h2>Dok čekate</h2>
<p>Google profil se za lokalne pretrage često pojavi brže od same stranice. Ako vam trebaju upiti odmah, oglasi na Googleu daju rezultat od prvog dana, dok SEO radi u pozadini.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Google Ads</span></p><h1 class="t-h2">Zašto vam Google Ads troši budžet, a telefon ne zvoni</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Novac odlazi svaki dan, klikovi se zbrajaju, a poziva nema. Kod malih tvrtki problem je rijetko u samom oglasu. Najčešće je u postavkama i u onome što se događa nakon klika.</p></header><div class="zip-prose">
<h2>1. Plaćate za pretrage koje nemaju veze s vama</h2>
<p>Ako oglašavate “popravak bojlera”, oglas se može prikazati i za “kako sam popraviti bojler” ili “bojler upute pdf”. U Google Adsu otvorite izvješće o pojmovima za pretraživanje (Search terms) i pogledajte za što ste stvarno plaćali. Pojmove koji ne donose posao dodajte kao negativne ključne riječi.</p>
<h2>2. Oglasi se prikazuju i izvan vašeg područja</h2>
<p>Zadana postavka lokacije cilja ljude koji su u vašem području, ali i one koji su samo pokazali interes za to područje. Za lokalnu uslugu to može značiti klikove ljudi koji vam nikad neće doći. Ako radite samo lokalno, u postavkama lokacije odaberite opciju koja cilja ljude koji su stvarno u području.</p>
<h2>3. Ne znate što donosi pozive</h2>
<p>Ako ne mjerite pozive i upite (praćenje konverzija), Google optimizira za klikove, a ne za kupce. Postavite praćenje poziva i obrasca prije nego što povećate budžet.</p>
<h2>4. Klik vodi na naslovnicu</h2>
<p>Netko je tražio jednu uslugu, a završio na naslovnici s pet drugih. Neka oglas vodi na stranicu baš te usluge, s brojem telefona vidljivim odmah, bez skrolanja.</p>
<h2>5. Oglasi rade kad se nitko ne javlja</h2>
<p>Ako se na telefon javljate od 8 do 16, oglasi koji vode na poziv u 22 sata troše novac. Raspored oglasa uskladite s vremenom kad stvarno možete odgovoriti.</p>
<h2>6. Budžet je razvučen na previše toga</h2>
<p>Mali budžet podijeljen na deset usluga i cijelu Hrvatsku znači da nigdje nema dovoljno klikova za zaključak. Krenite s jednom do dvije usluge koje donose najviše i s područjem gdje stvarno radite.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Google Ads</span></p><h1 class="t-h2">Koliko bi mali obrt trebao potrošiti na Google Ads mjesečno</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Nema jednog iznosa koji vrijedi za sve. Ali postoji jednostavan način da izračunate koliko vama treba, umjesto da nasumce stavite 100 ili 500 eura.</p></header><div class="zip-prose">
<h2>Krenite od upita, ne od budžeta</h2>
<p>Pitanje nije “koliko mogu potrošiti”, nego “koliko novih upita mjesečno želim”. Iz toga se budžet izračuna.</p>
<h2>Formula</h2>
<p><b>Budžet = broj upita koji želite ÷ postotak klikova koji postanu upit × cijena klika</b></p>
<p>Primjer (izmišljeni brojevi, samo da se vidi računica): želite 10 upita mjesečno. Ako vam svaki dvadeseti klik postane upit (5 %), trebate 200 klikova. Ako klik u vašoj djelatnosti košta 0,80 €, to je 160 € mjesečno.</p>
<h2>Odakle vam brojevi</h2>
<ul><li><b>Cijena klika:</b> u Google Adsu postoji besplatan alat Planer ključnih riječi (Keyword Planner) koji za vaše pojmove i područje pokazuje okvirnu cijenu klika.</li><li><b>Postotak klikova koji postanu upit:</b> u početku ga ne znate. Zato prvi mjesec služi da ga izmjerite, uz uključeno praćenje poziva i obrazaca.</li></ul>
<h2>Koliko dugo testirati</h2>
<p>Dovoljno dugo da skupite barem nekoliko desetaka klikova po usluzi. S premalo klikova svaki zaključak je slučajnost. Za većinu malih obrta to znači barem mjesec dana na jednoj ili dvije usluge.</p>
<h2>Kada povećati budžet</h2>
<p>Kad znate koliko vas stoji jedan upit i koliko vrijedi jedan posao. Ako vas upit stoji 15 €, a prosječan posao donosi 300 €, imate jasan razlog za više. Ako ne znate te brojke, povećanje budžeta je nagađanje.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Google Ads</span></p><h1 class="t-h2">Google Ads ili SEO: što prvo ako imate ograničen budžet</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Oglasi daju rezultat odmah i nestaju čim prestanete plaćati. SEO je spor, ali ostaje. Kad je budžet mali, redoslijed je važniji od izbora.</p></header><div class="zip-prose">
<h2>Razlika u jednoj rečenici</h2>
<p>Oglasima plaćate svaki klik i rezultat imate od prvog dana. SEO-om radite na tome da se pojavite besplatno, ali prvi rezultati dolaze tek za tjedne ili mjesece.</p>
<h2>Kada prvo oglasi</h2>
<ul><li>Trebaju vam upiti ovaj mjesec, ne za pola godine.</li><li>Želite brzo provjeriti traži li uopće netko vašu uslugu u vašem području.</li><li>Imate sezonski posao i trebate biti vidljivi točno u sezoni.</li></ul>
<h2>Kada prvo SEO</h2>
<ul><li>Ne žurite i radije ulažete u nešto što ostaje.</li><li>U vašoj djelatnosti je klik skup.</li><li>Ljudi vas traže po imenu ili po kvartu, a vi se tamo još ne pojavljujete.</li></ul>
<h2>Redoslijed koji preporučujemo</h2>
<ol><li><b>Besplatne stvari prvo:</b> točan Google Business profil i stranica koja jasno kaže što radite i gdje. Bez toga ni oglasi ni SEO ne rade dobro.</li><li><b>Mali test oglasa:</b> jedna ili dvije usluge, samo vaše područje, uz praćenje poziva. Tako za mjesec dana znate koliko vas stoji upit.</li><li><b>SEO u pozadini:</b> stranica za svaku glavnu uslugu, recenzije i povremeni članak. To radi i kad oglasi stanu.</li></ol>
<h2>Najčešća greška</h2>
<p>Pokrenuti oglase prema stranici koja ne pretvara posjetitelje u upite. Tada plaćate klikove koji se izgube. Prije oglasa provjerite može li netko u tri sekunde vidjeti što radite i kako vas kontaktirati.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Web stranice</span></p><h1 class="t-h2">Imam Facebook. Treba li mi uopće web stranica?</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Kratak odgovor: ponekad ne treba. Ali ako vas ljudi traže na Googleu, sama Facebook stranica obično nije dovoljna. Evo kako odlučiti.</p></header><div class="zip-prose">
<h2>Kada je Facebook dovoljan</h2>
<ul><li>Svi klijenti dolaze preko preporuke i ionako vas već znaju.</li><li>Ne tražite nove klijente, nego održavate postojeće.</li><li>Radite povremeno, kao hobi ili uz drugi posao.</li></ul>
<p>Ako se prepoznajete ovdje, stranica vam vjerojatno ne treba. Bolje je dobro voditi Facebook i Google profil nego imati stranicu koju nitko ne održava.</p>
<h2>Kada Facebook nije dovoljan</h2>
<h3>Ljudi vas traže na Googleu, ne na Facebooku</h3>
<p>Kad netko treba frizera, vodoinstalatera ili računovođu, upiše uslugu i mjesto u Google. U rezultatima se prikazuju Google profili tvrtki i web stranice. Google navodi da na lokalni poredak utječe i koliko je tvrtka poznata, između ostalog po linkovima na njezinu stranicu. Bez stranice taj dio ostaje prazan.</p>
<h3>Facebook nije vaš</h3>
<p>Pravila, izgled i doseg objava određuje Meta i mijenja ih kad hoće. Stranica i domena su vaši i ostaju vaši bez obzira na to što se dogodi s bilo kojom mrežom.</p>
<h3>Kupci žele provjeriti prije nego što se jave</h3>
<p>Prije prvog poziva ljudi žele vidjeti što točno radite, gdje ste i kako izgledaju vaši radovi. Na Facebooku je to raštrkano po objavama, a na stranici je na jednom mjestu.</p>
<h3>Teško je doći do upita</h3>
<p>Na Facebooku posjetitelj mora tražiti gumb za poruku ili broj telefona između objava. Dobra stranica ima jedan jasan put: poziv, obrazac ili rezervaciju.</p>
<h2>Ne mora biti velika stranica</h2>
<p>Za većinu malih tvrtki dovoljna je jedna stranica: što radite, za koga, gdje, nekoliko primjera rada i jasan način da vas se kontaktira. Važno je da je povezana s Google profilom i da se brzo otvara na mobitelu.</p>
<h2>Provjerite sami u tri koraka</h2>
<ol><li>Provjerite imate li Google Business profil i jesu li podaci točni.</li><li>Upišite svoju uslugu i mjesto u Google, npr. “frizer Trešnjevka”, i pogledajte tko se pojavljuje.</li><li>Ako vas nema, a ljudi traže to što radite, vrijeme je za stranicu.</li></ol>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Web stranice</span></p><h1 class="t-h2">Redizajn ili nova web stranica: kako odlučiti</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Stranica vam ne donosi upite i znate da nešto treba mijenjati. Pitanje je samo: popraviti postojeću ili krenuti ispočetka?</p></header><div class="zip-prose">
<h2>Kada je dovoljno popraviti</h2>
<ul><li>Stranica se brzo otvara na mobitelu.</li><li>Lako se uređuje, a sustav se redovito ažurira.</li><li>Struktura ima smisla, samo je put do upita nejasan ili su tekstovi slabi.</li><li>Na Googleu se već pojavljujete za neke pojmove.</li></ul>
<p>Tada najviše dobivate ciljanim izmjenama: jasnijim gumbom za upit, boljim tekstovima i bržom naslovnicom.</p>
<h2>Kada je bolje napraviti novu</h2>
<ul><li>Na mobitelu se teško koristi ili se raspada.</li><li>Nitko više ne zna kako se uređuje, ili za svaku sitnicu morate nekoga zvati.</li><li>Izgleda toliko staro da djeluje kao da više ne radite.</li><li>Usluge su se promijenile, a stranica i dalje govori o onome što više ne radite.</li></ul>
<p>Tada je krpanje često skuplje od nove stranice, jer plaćate rad na nečemu što ćete ionako morati zamijeniti.</p>
<h2>Tri pitanja prije odluke</h2>
<ol><li>Što stranica treba napraviti: dovesti poziv, upit ili rezervaciju?</li><li>Možete li sami promijeniti tekst, cijenu ili radno vrijeme?</li><li>Odakle danas dolaze ljudi koji vas pronađu: s Googlea, s mreža ili preko preporuke?</li></ol>
<p>Ako na prvo pitanje nemate jasan odgovor, nijedna stranica neće raditi dobro, ni stara ni nova. Krenite od toga.</p>
<h2>Na što paziti kod redizajna</h2>
<p>Ako stara stranica ima pozicije na Googleu, stare adrese treba preusmjeriti na nove. Inače i ljudi i Google završe na praznoj stranici, a pozicije padnu. Domena ostaje vaša, a nova stranica bi na kraju trebala u potpunosti prijeći u vaše vlasništvo, s datotekama i pristupom.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Web stranice</span></p><h1 class="t-h2">Zašto vam stranica izgleda dobro, ali ne donosi upite ni rezervacije</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Stranica je lijepa, svima se sviđa, a upita nema. Izgled je samo jedan dio. Posjetitelj u nekoliko sekundi odlučuje hoće li se javiti, i najčešće odustane zbog sitnica.</p></header><div class="zip-prose">
<h2>1. Ne vidi se odmah što radite</h2>
<p>Velika fotografija i slogan poput “Vaš partner za budućnost” lijepo izgledaju, ali posjetitelj ne zna je li na pravom mjestu. Prvi ekran treba reći što radite, za koga i gdje.</p>
<h2>2. Nema jednog jasnog sljedećeg koraka</h2>
<p>Ako su na stranici “Saznaj više”, “Pogledaj galeriju”, “Prati nas” i “Kontakt” jednako važni, posjetitelj ne klikne ništa. Odlučite što želite da napravi (nazove, pošalje upit, rezervira) i neka taj gumb bude najuočljiviji.</p>
<h2>3. Na mobitelu je teško</h2>
<p>Većina ljudi stranicu otvara na mobitelu. Broj telefona koji se ne može kliknuti, obrazac s deset polja ili gumb koji se ne vidi bez skrolanja znače izgubljene upite.</p>
<h2>4. Sporo se otvara</h2>
<p>Lijepe velike fotografije često su i najveći razlog sporosti. Ako stranica na mobilnom internetu treba više od nekoliko sekundi, dio ljudi ode prije nego što je vidi.</p>
<h2>5. Nema razloga da vam vjeruju</h2>
<p>Recenzije, primjeri rada, prava imena i fotografije ljudi, adresa. Bez toga posjetitelj ne zna je li tvrtka stvarna i još uvijek radi.</p>
<h2>6. Obrazac ili rezervacija ne rade</h2>
<p>Zvuči banalno, ali događa se: obrazac šalje poruke na stari e-mail ili rezervacija javlja grešku. Pošaljite sami sebi upit s mobitela i provjerite stiže li.</p>
<h2>Test od pet minuta</h2>
<p>Dajte mobitel nekome tko vas ne zna i zamolite ga da vas kontaktira preko stranice. Ne pomažite. Gdje zastane, tamo stranica gubi upite.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Web stranice</span></p><h1 class="t-h2">Što svaka poslovna web stranica mora imati po zakonu</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Većina malih tvrtki na stranici nema sve podatke koje propisi traže. To je lako ispraviti, ali prvo treba znati što točno mora pisati.</p></header><div class="zip-prose">
<p><i>Ovo je pregled za lakše snalaženje, ne pravni savjet. Za svoj slučaj provjerite s knjigovođom ili pravnikom.</i></p>
<h2>Ako ste obrt</h2>
<ul><li>Naziv obrta (tvrtka) i oznaka obrta</li><li>Ime i prezime vlasnika</li><li>Adresa sjedišta</li><li>Tijelo koje vodi obrtni registar i broj upisa</li><li>OIB</li><li>Banka i broj računa</li><li>Kontakt: e-mail i telefon</li></ul>
<h2>Ako ste d.o.o.</h2>
<ul><li>Tvrtka (puni naziv) i sjedište</li><li>Sud pri kojem je društvo upisano i matični broj subjekta (MBS)</li><li>OIB</li><li>Banka i IBAN</li><li>Iznos temeljnog kapitala i je li uplaćen u cijelosti</li><li>Imena članova uprave</li><li>Kontakt: e-mail i telefon</li></ul>
<p>Popis za d.o.o. dolazi iz članka 21. Zakona o trgovačkim društvima, a kontakt podaci iz Zakona o elektroničkoj trgovini.</p>
<h2>Za sve: politika privatnosti</h2>
<p>Ako stranica prikuplja bilo kakve osobne podatke (obrazac za kontakt, rezervacija, newsletter), mora imati politiku privatnosti: tko obrađuje podatke, zašto, koliko dugo ih čuva, tko ih još dobiva i koja prava ljudi imaju.</p>
<h2>Za sve: kolačići</h2>
<p>Kolačići koji su nužni za rad stranice ne traže privolu. Kolačići za analitiku ili oglase traže privolu posjetitelja prije nego što se postave, a ne samo obavijest “ova stranica koristi kolačiće”.</p>
<h2>Ako prodajete preko stranice</h2>
<p>Web trgovina ima dodatne obveze: jasne cijene s PDV-om, uvjete prodaje, pravo na jednostrani raskid i podatke o reklamacijama. To je zasebna tema.</p>
<h2>Popis za provjeru</h2>
<ol><li>Pogledajte podnožje svoje stranice: jesu li svi podaci od gore tamo?</li><li>Postoji li politika privatnosti i je li povezana uz svaki obrazac?</li><li>Koristite li Google Analytics ili Meta Pixel? Ako da, pitate li za privolu?</li></ol>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Web stranice</span></p><h1 class="t-h2">Koliko bi vas stvarno trebala koštati web stranica u 2026.</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Cijene izrade web stranica u Hrvatskoj kreću se od nekoliko stotina do nekoliko tisuća eura. Razlika nije samo u izgledu, nego u tome što dobijete i što plaćate kasnije.</p></header><div class="zip-prose">
<h2>Okvirni rasponi na tržištu</h2>
<p>Prema pregledu cijena za 2026. jedne hrvatske agencije, jednostavna predstavljačka stranica za obrt ili malu tvrtku je oko 400–900 €, poslovna stranica s više sadržaja oko 900–1.800 €, a web trgovina od oko 1.200 € naviše. To su tuđe cijene i služe samo kao orijentacija.</p>
<h2>Što određuje cijenu</h2>
<ul><li>Broj stranica i koliko sadržaja ima svaka</li><li>Gotov predložak ili dizajn rađen za vas</li><li>Obrazac za upite, sustav za rezervacije ili trgovina</li><li>Tko piše tekstove i tko daje fotografije</li><li>Broj jezika</li><li>Je li uključena osnovna SEO priprema i povezivanje s Google profilom</li></ul>
<h2>Troškovi koje ljudi zaborave</h2>
<ul><li>Domena i hosting, svake godine</li><li>Održavanje i ažuriranja</li><li>Izmjene nakon objave: jesu li uključene ili se naplaćuju po satu?</li><li>Fotografije i tekstovi, ako ih nemate</li></ul>
<h2>Kada je jeftino zapravo skupo</h2>
<p>Stranica za 200 € koja ne donosi nijedan upit skuplja je od one za 900 € koja donese posao mjesečno. Pitajte što stranica treba napraviti za vas, a ne samo koliko košta.</p>
<h2>Pet pitanja prije potpisa</h2>
<ol><li>Što je točno uključeno, a što se plaća posebno?</li><li>Čija je stranica nakon objave: datoteke, domena i pristupi?</li><li>Mogu li sam mijenjati tekst i cijene?</li><li>Koliko košta godišnje nakon prve godine?</li><li>Je li stranica povezana s Google profilom i pripremljena za Google?</li></ol>
<p>Kod nas cijenu dobijete napismeno nakon besplatne provjere, prije bilo kakvog posla.</p>

<h2>Što Instagram gleda</h2>
<p>Instagram objašnjava da pri slaganju objava u feedu gleda, između ostalog, koliko ljudi i koliko brzo lajka, komentira, dijeli i sprema objavu, te koliko su ljudi u zadnjih nekoliko tjedana komunicirali s vama. Broj objava nije među tim signalima.</p>
<h2>Zašto svakodnevne objave mogu odmoći</h2>
<p>Ako svaka objava dobije malo reakcija, to je signal da sadržaj ljudima nije zanimljiv. Usto, kad objavljujete pod pritiskom, kvaliteta pada, a ljudi brzo nauče preskakati vaše objave.</p>
<h2>Što napraviti umjesto toga</h2>
<ul><li><b>Manje, ali bolje.</b> Dvije do tri objave tjedno koje netko želi spremiti ili poslati prijatelju vrijede više od sedam koje nitko ne pogleda.</li><li><b>Odgovarajte na svaki komentar i poruku,</b> i to brzo. Razgovor je signal, a i način da upit postane posao.</li><li><b>Pitajte nešto konkretno.</b> “Što vam je teže, X ili Y?” dobije više odgovora od “Javite se!”.</li><li><b>Sadržaj koji se sprema:</b> popisi, savjeti, usporedbe prije i poslije.</li><li><b>Pratite poruke i upite, ne samo lajkove.</b> Lajk ne plaća račune.</li></ul>
<h2>Kako znati radi li</h2>
<p>Jednom mjesečno pogledajte koje su objave donijele poruku, poziv ili posjet stranici. Napravite više takvih, a manje onih koje ne donose ništa.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Društvene mreže</span></p><h1 class="t-h2">3 vrste objava koje stvarno dovode klijente malim obrtima</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Lijepe fotografije i blagdanske čestitke skupljaju lajkove. Upite donose objave koje pokazuju rad, odgovaraju na pitanja i dokazuju da ste pouzdani.</p></header><div class="zip-prose">
<h2>1. Rad iza kulisa: prije i poslije, ili kako nastaje</h2>
<p>Ljudi kupuju rezultat, a vjeruju procesu. Pokažite stan prije i poslije bojanja, frizuru u tri koraka, popravak od kvara do rješenja. Kratki video ili carousel s tri do pet fotografija je dovoljan.</p>
<p><b>Završite s:</b> “Imate sličan problem? Pošaljite fotografiju u poruci.”</p>
<h2>2. Odgovor na pitanje koje vam kupci stvarno postavljaju</h2>
<p>Svako pitanje koje ste čuli tri puta je tema za objavu: “Koliko traje…?”, “Koliko košta…?”, “Što ako…?”. Takve objave ljudi spremaju i šalju dalje, a vi ih poslije možete slati kao link kad netko opet pita.</p>
<p><b>Završite s:</b> “Imate drugo pitanje? Napišite ga u komentar.”</p>
<h2>3. Dokaz: što kaže kupac</h2>
<p>Recenzija s Googlea, poruka zadovoljnog kupca ili kratka izjava, uvijek uz dopuštenje. Uz to dodajte što ste točno napravili. “Super ste!” je lijepo, ali “Riješili ste curenje za sat vremena, u nedjelju” prodaje.</p>
<p><b>Završite s:</b> broj telefona ili link za rezervaciju.</p>
<h2>Omjer koji radi</h2>
<p>Ne treba svaka objava prodavati. Ali svaka treba pokazati da znate što radite. Ako u mjesecu imate po jednu od ove tri vrste, već ste ispred većine konkurencije.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/hr/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Društvene mreže</span></p><h1 class="t-h2">Instagram ili Facebook: gdje je vaš klijent stvarno aktivan</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1. listopada 2026.</time> · 2 min čitanja · zip</p><p class="t-lede">Nema univerzalnog odgovora. Ovisi o tome tko su vaši kupci i kako vas traže. Dobra vijest je da to možete provjeriti za jedno popodne umjesto da nagađate.</p></header><div class="zip-prose">
<h2>1. Pitajte kupce</h2>
<p>Najjednostavnije i najtočnije. Sljedećih deset kupaca pitajte kako su vas našli i koju mrežu najviše koriste. Deset odgovora reći će vam više od bilo koje statistike.</p>
<h2>2. Pogledajte odakle stižu upiti</h2>
<p>Ako vam pišu na Facebook poruke, a na Instagramu imate lajkove, ali ne i poruke, odgovor je već tu. Upit vrijedi više od pratitelja.</p>
<h2>3. Pogledajte konkurenciju</h2>
<p>Nađite tri do pet tvrtki iz svoje djelatnosti i grada. Gdje imaju komentare i pitanja kupaca, a ne samo lajkove? Tamo su i vaši kupci.</p>
<h2>4. Razmislite kako vas traže</h2>
<p>Ako ljudi traže uslugu kad im zatreba (vodoinstalater, servis, odvjetnik), prvo dolazi Google, a ne mreže. Ako kupuju očima (frizura, nokti, hrana, interijer), Instagram ima više smisla.</p>
<h2>Naš savjet za male tvrtke</h2>
<ul><li>Jedna mreža koju vodite redovito bolja je od dvije koje vodite povremeno.</li><li>Prije bilo koje mreže sredite Google Business profil. Tamo vas ljudi traže kad su spremni kupiti.</li><li>Isti sadržaj možete objaviti na obje mreže, ali odgovarajte tamo gdje ljudi stvarno pišu.</li></ul>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell" style="display:grid;gap:44px"><header style="display:grid;gap:16px;max-width:62ch"><p class="pill-eyebrow">Blog</p><h1 class="t-h2">Blog</h1><p class="t-lede">Kratki, konkretni članci o tome kako male tvrtke dolaze do upita: Google profil, web stranica, oglasi i društvene mreže.</p><nav aria-label="Kategorije" style="display:flex;flex-wrap:wrap;gap:8px"><a href="#cat-seo" class="chip" style="text-decoration:none">SEO</a><a href="#cat-ads" class="chip" style="text-decoration:none">Google Ads</a><a href="#cat-web" class="chip" style="text-decoration:none">Web stranice</a><a href="#cat-social" class="chip" style="text-decoration:none">Društvene mreže</a></nav></header><section id="cat-seo" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">SEO</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/hr/blog/greske-na-google-business-profilu" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">7 grešaka na Google profilu zbog kojih vas kupci ne pronađu</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Google profil je često prvo što netko vidi o vašoj tvrtki, prije stranice i prije poziva. Ovo su greške koje najčešće koče male tvrtke i kako ih ispraviti za jedno popodne.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/zasto-vas-ne-nalaze-na-googleu" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Zašto vas ne nalaze na Googleu iako imate web stranicu</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Stranica postoji, plaćate domenu i hosting, a kad upišete svoju uslugu u Google, pojavljuje se svatko osim vas. Razlog je gotovo uvijek jedan od ovih pet.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/koliko-traje-da-se-stranica-pojavi-na-googleu" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Koliko stvarno traje da se stranica pojavi na Googleu</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Objavili ste stranicu i čekate. Postoje dvije različite stvari koje se miješaju: kada će vas Google uopće uvrstiti i kada će vas ljudi stvarno pronaći.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li></ul></section><section id="cat-ads" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">Google Ads</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/hr/blog/google-ads-trosi-budzet-a-telefon-ne-zvoni" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Zašto vam Google Ads troši budžet, a telefon ne zvoni</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Novac odlazi svaki dan, klikovi se zbrajaju, a poziva nema. Kod malih tvrtki problem je rijetko u samom oglasu. Najčešće je u postavkama i u onome što se događa nakon klika.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/koliko-potrositi-na-google-ads-mjesecno" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Koliko bi mali obrt trebao potrošiti na Google Ads mjesečno</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Nema jednog iznosa koji vrijedi za sve. Ali postoji jednostavan način da izračunate koliko vama treba, umjesto da nasumce stavite 100 ili 500 eura.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/google-ads-ili-seo-sto-prvo" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Google Ads ili SEO: što prvo ako imate ograničen budžet</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Oglasi daju rezultat odmah i nestaju čim prestanete plaćati. SEO je spor, ali ostaje. Kad je budžet mali, redoslijed je važniji od izbora.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li></ul></section><section id="cat-web" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">Web stranice</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/hr/blog/treba-li-mi-web-stranica-ako-imam-facebook" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Imam Facebook. Treba li mi uopće web stranica?</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Kratak odgovor: ponekad ne treba. Ali ako vas ljudi traže na Googleu, sama Facebook stranica obično nije dovoljna. Evo kako odlučiti.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/redizajn-ili-nova-web-stranica" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Redizajn ili nova web stranica: kako odlučiti</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Stranica vam ne donosi upite i znate da nešto treba mijenjati. Pitanje je samo: popraviti postojeću ili krenuti ispočetka?</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/stranica-izgleda-dobro-ali-ne-donosi-upite" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Zašto vam stranica izgleda dobro, ali ne donosi upite ni rezervacije</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Stranica je lijepa, svima se sviđa, a upita nema. Izgled je samo jedan dio. Posjetitelj u nekoliko sekundi odlučuje hoće li se javiti, i najčešće odustane zbog sitnica.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/sto-poslovna-web-stranica-mora-imati-po-zakonu" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Što svaka poslovna web stranica mora imati po zakonu</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Većina malih tvrtki na stranici nema sve podatke koje propisi traže. To je lako ispraviti, ali prvo treba znati što točno mora pisati.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/koliko-kosta-web-stranica-2026" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Koliko bi vas stvarno trebala koštati web stranica u 2026.</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Cijene izrade web stranica u Hrvatskoj kreću se od nekoliko stotina do nekoliko tisuća eura. Razlika nije samo u izgledu, nego u tome što dobijete i što plaćate kasnije.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li></ul></section><section id="cat-social" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">Društvene mreže</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/hr/blog/zasto-svakodnevno-objavljivanje-ne-pomaze" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Zašto objavljivanje svaki dan ne pomaže ako nitko ne komentira</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Više objava ne znači više ljudi. Ako nitko ne reagira, svaka nova objava ide sve manjem broju ljudi, a vi trošite vrijeme koje biste mogli uložiti u nešto što radi.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/3-vrste-objava-koje-dovode-klijente" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">3 vrste objava koje stvarno dovode klijente malim obrtima</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Lijepe fotografije i blagdanske čestitke skupljaju lajkove. Upite donose objave koje pokazuju rad, odgovaraju na pitanja i dokazuju da ste pouzdani.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li><li><a href="#/hr/blog/instagram-ili-facebook-gdje-je-vas-klijent" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min čitanja</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Instagram ili Facebook: gdje je vaš klijent stvarno aktivan</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Nema univerzalnog odgovora. Ovisi o tome tko su vaši kupci i kako vas traže. Dobra vijest je da to možete provjeriti za jedno popodne umjesto da nagađate.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Pročitajte</span></a></li></ul></section></div></main>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">SEO</span></p><h1 class="t-h2">7 Google profile mistakes that stop customers finding you</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Your Google profile is often the first thing people see about your business, before your website and before they call. These are the mistakes that most often hold small businesses back, and how to fix them in an afternoon.</p></header><div class="zip-prose">
<p>Google says local results depend on three things: how well a profile matches what someone is looking for, how close you are to them, and how well-known your business is. You can’t change the distance, but you can work on the other two. First of all: your profile has to be verified, or you can’t edit it.</p>
<h2>1. The wrong or a too-general category</h2>
<p>Your primary category tells Google what you do. Pick the most specific one available, for example “Hair salon” rather than “Beauty salon” if you only do hair. Add your other services as additional categories.</p>
<h2>2. The profile doesn’t link to your site, or links to the wrong page</h2>
<p>Without a website link, people who want more information have nowhere to go. If the link lands on a home page without even a phone number, you’ve lost them. Link to a page with a clear way to get in touch.</p>
<h2>3. Wrong opening hours</h2>
<p>Nothing breaks trust faster than a locked door when Google says you’re open. Add special hours for public holidays and time off too.</p>
<h2>4. Name, address and phone don’t match</h2>
<p>If your profile shows one number, your website another and Facebook a third, both people and Google get confused. Write your business name, address and phone exactly the same way everywhere.</p>
<h2>5. No photos, or old ones</h2>
<p>Google recommends photos and videos because they show customers what you offer. Add real photos of your space, your team and your work, and refresh them now and then.</p>
<h2>6. Reviews without replies</h2>
<p>Google recommends replying to reviews. Reply to every one, good and bad, briefly and politely. Customers read your replies, not just the reviews.</p>
<h2>7. An empty description and services</h2>
<p>The description and services are where you say, in your own words, what you do and where. Write them the way a customer would search for you: “haircuts and colouring, Trešnjevka, Zagreb”, not “premium tailored service”.</p>
<h2>Quick check</h2>
<ul><li>The profile is verified.</li><li>The primary category is as specific as possible.</li><li>The link goes to a page with a phone number or a form.</li><li>Opening hours are correct, including holidays.</li><li>Name, address and phone are the same everywhere.</li><li>There are real photos from the last few months.</li><li>Every review has a reply.</li><li>The description and services use the words customers search with.</li></ul>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">SEO</span></p><h1 class="t-h2">Why people can’t find you on Google even though you have a website</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">The site exists, you pay for the domain and hosting, and when you type your service into Google everyone shows up except you. The reason is almost always one of these five.</p></header><div class="zip-prose">
<h2>1. Google hasn’t indexed the site at all</h2>
<p>Type <b>site:yourdomain.com</b> into Google (with your domain). If no pages show up, Google hasn’t added you to its results yet. A new site needs time, and it helps to add it to Google Search Console and submit a sitemap.</p>
<h2>2. The site tells Google not to show it</h2>
<p>While a site is being built, a setting that tells Google not to show it (called noindex) is often switched on. If nobody switches it off at launch, the site stays invisible no matter what else you do. Search Console shows this in the indexing report.</p>
<h2>3. The site doesn’t say what people search for</h2>
<p>People search for “plumber Dubrava” or “accountant for sole traders Zagreb”. If your site only says “Quality and reliability since 2005”, Google doesn’t know what to show you for. The page title, the main heading and the first paragraph should say what you do and where.</p>
<h2>4. Your Google profile isn’t linked to the site</h2>
<p>For local searches, your Google Business profile does a lot of the work. <a class="text-fg underline" href="https://support.google.com/business/answer/7091" target="_blank" rel="noopener noreferrer">Google</a> says local ranking depends on how well a profile matches the search, distance and how well-known a business is. A profile without a link to your site and a site without a profile each do half the job.</p>
<h2>5. The competition is simply stronger</h2>
<p>Sometimes everything is technically fine, but others have more reviews, more content and have been around longer. Then only patient work helps: an accurate profile, regular reviews and a page for each main service.</p>
<h2>A ten-minute check</h2>
<ol><li>Type <b>site:yourdomain.com</b> and see whether there are results.</li><li>Type your service and neighbourhood or town and see who shows up.</li><li>Open your home page and check whether the first paragraph says what you do and where.</li><li>Check that your Google profile links to your site.</li></ol>
