<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">SEO</span></p><h1 class="t-h2">How long it really takes for your website to show up on Google</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">You’ve launched your site and you’re waiting. Two different things get mixed up here: when Google includes you at all, and when people actually find you.</p></header><div class="zip-prose">
<h2>Getting included: days to weeks</h2>
<p>Google says crawling can take anywhere from a few days to a few weeks, and that requesting a crawl doesn’t guarantee the page will appear in results instantly, or at all. Nobody can promise you an exact date.</p>
<h2>Ranking: usually longer</h2>
<p>Being included doesn’t mean you’re on the first page. For searches where competitors have been around for years, a new site realistically needs months. When someone types your exact business name, you’ll show up much faster than for a general term like “web design Zagreb”.</p>
<h2>What you can speed up</h2>
<ul><li>Add the site to Google Search Console and submit a sitemap.</li><li>Check that the site doesn’t tell Google not to show it (noindex).</li><li>Link your Google Business profile to the site.</li><li>Give each main service its own page with a clear title.</li><li>Link to the site from places that already exist: your profile, social media, directories.</li></ul>
<h2>What doesn’t help</h2>
<p>Sending Google the same request again and again doesn’t speed anything up, and Google says there are limits on it. Services promising “page one in a week” usually can’t deliver.</p>
<h2>While you wait</h2>
<p>For local searches, a Google profile often shows up sooner than the site itself. If you need enquiries now, Google Ads work from day one while SEO works in the background.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Google Ads</span></p><h1 class="t-h2">Why Google Ads is spending your budget and the phone isn’t ringing</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Money goes out every day, clicks add up, and nobody calls. For small businesses the problem is rarely the ad itself. It’s usually the settings and what happens after the click.</p></header><div class="zip-prose">
<h2>1. You pay for searches that have nothing to do with you</h2>
<p>If you advertise “boiler repair”, your ad can also show for “how to fix a boiler myself” or “boiler manual pdf”. In Google Ads, open the search terms report and see what you actually paid for. Add the terms that don’t bring work as negative keywords.</p>
<h2>2. Your ads show outside your area</h2>
<p>The default location setting reaches people in your area, and also people who have only shown interest in it. For a local service that can mean clicks from people who will never come to you. If you only work locally, choose the location option that targets people who are actually in the area.</p>
<h2>3. You don’t know what brings calls</h2>
<p>If you don’t measure calls and enquiries (conversion tracking), Google optimises for clicks, not customers. Set up call and form tracking before you raise the budget.</p>
<h2>4. The click lands on your home page</h2>
<p>Someone searched for one service and landed on a home page with five others. Send each ad to the page for that service, with the phone number visible straight away, no scrolling.</p>
<h2>5. Ads run when nobody picks up</h2>
<p>If you answer the phone from 8 to 4, ads that lead to calls at 10 pm waste money. Match your ad schedule to when you can actually answer.</p>
<h2>6. The budget is spread too thin</h2>
<p>A small budget split across ten services and the whole country means nothing gets enough clicks to learn from. Start with one or two services that earn the most and the area where you actually work.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Google Ads</span></p><h1 class="t-h2">How much a small business should spend on Google Ads per month</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">There’s no single figure that fits everyone. But there is a simple way to work out what you need, instead of picking 100 or 500 euros at random.</p></header><div class="zip-prose">
<h2>Start from enquiries, not from the budget</h2>
<p>The question isn’t “how much can I spend”, it’s “how many new enquiries a month do I want”. The budget follows from that.</p>
<h2>The formula</h2>
<p><b>Budget = enquiries you want ÷ share of clicks that become an enquiry × cost per click</b></p>
<p>Example (made-up numbers, just to show the maths): you want 10 enquiries a month. If one in twenty clicks becomes an enquiry (5%), you need 200 clicks. If a click in your field costs €0.80, that’s €160 a month.</p>
<h2>Where the numbers come from</h2>
<ul><li><b>Cost per click:</b> Google Ads has a free Keyword Planner that shows an estimated cost per click for your terms and area.</li><li><b>Share of clicks that become an enquiry:</b> you don’t know it at first. That’s what the first month is for, with call and form tracking switched on.</li></ul>
<h2>How long to test</h2>
<p>Long enough to collect at least a few dozen clicks per service. With too few clicks, every conclusion is chance. For most small businesses that means at least a month on one or two services.</p>
<h2>When to raise the budget</h2>
<p>When you know what one enquiry costs you and what one job is worth. If an enquiry costs you €15 and an average job brings €300, you have a clear reason to spend more. If you don’t know those numbers, raising the budget is guesswork.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Google Ads</span></p><h1 class="t-h2">Google Ads or SEO: what to do first on a limited budget</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Ads work from day one and stop the moment you stop paying. SEO is slow, but it stays. When the budget is small, the order matters more than the choice.</p></header><div class="zip-prose">
<h2>The difference in one sentence</h2>
<p>With ads you pay for every click and get results from day one. With SEO you work towards showing up for free, but the first results take weeks or months.</p>
<h2>When ads come first</h2>
<ul><li>You need enquiries this month, not in six months.</li><li>You want to check quickly whether anyone searches for your service in your area.</li><li>Your business is seasonal and you need to be visible exactly in season.</li></ul>
<h2>When SEO comes first</h2>
<ul><li>You’re not in a hurry and would rather invest in something that lasts.</li><li>Clicks are expensive in your field.</li><li>People search for you by name or neighbourhood, and you don’t show up there yet.</li></ul>
<h2>The order we recommend</h2>
<ol><li><b>Free things first:</b> an accurate Google Business profile and a site that clearly says what you do and where. Without them, neither ads nor SEO work well.</li><li><b>A small ads test:</b> one or two services, only your area, with call tracking. In a month you know what an enquiry costs you.</li><li><b>SEO in the background:</b> a page for each main service, reviews and the occasional article. It keeps working when the ads stop.</li></ol>
<h2>The most common mistake</h2>
<p>Running ads to a site that doesn’t turn visitors into enquiries. Then you pay for clicks that get lost. Before ads, check that someone can see in three seconds what you do and how to contact you.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Websites</span></p><h1 class="t-h2">I have Facebook. Do I even need a website?</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Short answer: sometimes you don’t. But if people look for you on Google, a Facebook page on its own usually isn’t enough. Here’s how to decide.</p></header><div class="zip-prose">
<h2>When Facebook is enough</h2>
<ul><li>All your customers come through referrals and already know you.</li><li>You’re not looking for new customers, just looking after existing ones.</li><li>You work occasionally, as a hobby or alongside another job.</li></ul>
<p>If that sounds like you, you probably don’t need a website. A well-kept Facebook page and Google profile beat a website nobody maintains.</p>
<h2>When Facebook isn’t enough</h2>
<h3>People look for you on Google, not Facebook</h3>
<p>When someone needs a hairdresser, a plumber or an accountant, they type the service and the town into Google. The results show business profiles and websites. Google says local ranking also depends on how well-known a business is, including links to its website. Without a website, that part stays empty.</p>
<h3>Facebook isn’t yours</h3>
<p>Meta decides the rules, the layout and how many people see your posts, and changes them whenever it wants. Your website and domain are yours, whatever happens to any social network.</p>
<h3>Customers want to check before they get in touch</h3>
<p>Before the first call, people want to see what exactly you do, where you are and what your work looks like. On Facebook that’s scattered across posts. On a website it’s in one place.</p>
<h3>Getting in touch is harder than it should be</h3>
<p>On Facebook, a visitor has to hunt for the message button or a phone number between posts. A good website has one clear path: a call, a form or a booking.</p>
<h2>It doesn’t have to be a big website</h2>
<p>For most small businesses one page is enough: what you do, for whom, where, a few examples of your work and a clear way to contact you. What matters is that it’s linked to your Google profile and loads fast on a phone.</p>
<h2>Check for yourself in three steps</h2>
<ol><li>Check that you have a Google Business profile and that the details are correct.</li><li>Type your service and town into Google, for example “hairdresser Trešnjevka”, and see who shows up.</li><li>If you’re not there and people search for what you do, it’s time for a website.</li></ol>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Websites</span></p><h1 class="t-h2">Website redesign or a new site: how to decide</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Your website doesn’t bring enquiries and you know something has to change. The only question is: fix what you have, or start over?</p></header><div class="zip-prose">
<h2>When fixing is enough</h2>
<ul><li>The site loads fast on a phone.</li><li>It’s easy to edit, and the system gets regular updates.</li><li>The structure makes sense; only the path to an enquiry is unclear or the copy is weak.</li><li>You already show up on Google for some searches.</li></ul>
<p>Then targeted changes give you the most: a clearer enquiry button, better copy and a faster home page.</p>
<h2>When a new site is the better choice</h2>
<ul><li>It’s hard to use on a phone, or falls apart.</li><li>Nobody knows how to edit it any more, or you have to call someone for every small change.</li><li>It looks so dated that you seem to have closed.</li><li>Your services have changed, but the site still talks about what you no longer do.</li></ul>
<p>Then patching is often more expensive than a new site, because you pay for work on something you’ll have to replace anyway.</p>
<h2>Three questions before you decide</h2>
<ol><li>What should the site do: bring a call, an enquiry or a booking?</li><li>Can you change the copy, a price or your hours yourself?</li><li>Where do the people who find you today come from: Google, social media or referrals?</li></ol>
<p>If you don’t have a clear answer to the first question, no website will work well, old or new. Start there.</p>
<h2>What to watch for in a redesign</h2>
<p>If your old site ranks on Google, the old addresses need to redirect to the new ones. Otherwise both people and Google land on an empty page, and rankings drop. The domain stays yours, and at the end the new site should be fully handed over to you, with the files and access.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Websites</span></p><h1 class="t-h2">Why your website looks good but brings no enquiries or bookings</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">The site looks great, everyone likes it, and nobody gets in touch. Looks are only part of it. A visitor decides in a few seconds whether to contact you, and usually gives up over small things.</p></header><div class="zip-prose">
<h2>1. It’s not obvious what you do</h2>
<p>A big photo and a slogan like “Your partner for the future” look nice, but the visitor doesn’t know if they’re in the right place. The first screen should say what you do, for whom and where.</p>
<h2>2. There’s no single clear next step</h2>
<p>If “Learn more”, “See the gallery”, “Follow us” and “Contact” all look equally important, the visitor clicks nothing. Decide what you want them to do (call, send an enquiry, book) and make that button the most visible.</p>
<h2>3. It’s hard to use on a phone</h2>
<p>Most people open your site on a phone. A phone number you can’t tap, a form with ten fields or a button you can’t see without scrolling all mean lost enquiries.</p>
<h2>4. It loads slowly</h2>
<p>Big beautiful photos are often the main reason a site is slow. If it takes more than a few seconds on mobile data, some people leave before they see it.</p>
<h2>5. There’s no reason to trust you</h2>
<p>Reviews, examples of your work, real names and photos of people, an address. Without them, a visitor can’t tell whether the business is real and still open.</p>
<h2>6. The form or booking doesn’t work</h2>
<p>It sounds obvious, but it happens: the form sends to an old email, or the booking throws an error. Send yourself an enquiry from your phone and check it arrives.</p>
<h2>A five-minute test</h2>
<p>Hand your phone to someone who doesn’t know you and ask them to contact you through the site. Don’t help. Wherever they get stuck is where the site loses enquiries.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Websites</span></p><h1 class="t-h2">What every business website in Croatia must show by law</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Most small businesses don’t have all the details the rules require on their site. It’s easy to fix, but first you need to know what exactly has to be there.</p></header><div class="zip-prose">
<p><i>This is an overview to help you find your way, not legal advice. Check your own case with your accountant or a lawyer.</i></p>
<h2>If you’re a sole trader (obrt)</h2>
<ul><li>Business name and type of trade</li><li>Owner’s full name</li><li>Registered address</li><li>The body that keeps the trade register and your registration number</li><li>OIB (tax number)</li><li>Bank and account number</li><li>Contact: email and phone</li></ul>
<h2>If you’re a limited company (d.o.o.)</h2>
<ul><li>Full company name and registered office</li><li>The court where the company is registered and its registration number (MBS)</li><li>OIB</li><li>Bank and IBAN</li><li>Share capital and whether it is fully paid</li><li>Names of the management board</li><li>Contact: email and phone</li></ul>
<p>The list for a d.o.o. comes from Article 21 of the Companies Act (Zakon o trgovačkim društvima), and the contact details from the E-Commerce Act (Zakon o elektroničkoj trgovini).</p>
<h2>For everyone: a privacy policy</h2>
<p>If the site collects any personal data (a contact form, a booking, a newsletter), it needs a privacy policy: who processes the data, why, how long it’s kept, who else receives it and what rights people have.</p>
<h2>For everyone: cookies</h2>
<p>Cookies needed for the site to work don’t require consent. Cookies for analytics or advertising need the visitor’s consent before they’re set, not just a notice saying “this site uses cookies”.</p>
<h2>If you sell through the site</h2>
<p>An online shop has extra obligations: clear prices including VAT, terms of sale, the right of withdrawal and complaint details. That’s a separate topic.</p>
<h2>Checklist</h2>
<ol><li>Look at your site’s footer: are all the details above there?</li><li>Is there a privacy policy, and is it linked next to every form?</li><li>Do you use Google Analytics or Meta Pixel? If so, do you ask for consent?</li></ol>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Websites</span></p><h1 class="t-h2">How much a website should really cost you in 2026</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Website prices in Croatia range from a few hundred to a few thousand euros. The difference isn’t just the design, it’s what you get and what you pay later.</p></header><div class="zip-prose">
<h2>Rough ranges on the market</h2>
<p>According to one Croatian agency’s 2026 price overview, a simple presentation site for a small business is around €400–900, a business site with more content around €900–1,800, and an online shop from around €1,200 up. These are other people’s prices, meant only as a guide.</p>
<h2>What drives the price</h2>
<ul><li>How many pages, and how much content on each</li><li>A ready-made template or a design made for you</li><li>An enquiry form, a booking system or a shop</li><li>Who writes the copy and who provides the photos</li><li>How many languages</li><li>Whether basic SEO and linking to your Google profile are included</li></ul>
<h2>Costs people forget</h2>
<ul><li>Domain and hosting, every year</li><li>Maintenance and updates</li><li>Changes after launch: included, or charged by the hour?</li><li>Photos and copy, if you don’t have them</li></ul>
<h2>When cheap is actually expensive</h2>
<p>A €200 site that brings no enquiries costs more than a €900 one that brings work every month. Ask what the site needs to do for you, not just what it costs.</p>
<h2>Five questions before you sign</h2>
<ol><li>What exactly is included, and what costs extra?</li><li>Who owns the site after launch: files, domain and access?</li><li>Can I change the copy and prices myself?</li><li>What does it cost per year after the first year?</li><li>Is the site linked to my Google profile and set up for Google?</li></ol>
<p>With us, you get the price in writing after the free check, before any work starts.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Social media</span></p><h1 class="t-h2">Why posting every day doesn’t help if nobody comments</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">More posts don’t mean more people. If nobody reacts, each new post reaches fewer people, and you spend time you could put into something that works.</p></header><div class="zip-prose">
<h2>What Instagram looks at</h2>
<p>Instagram explains that when it ranks Feed posts it looks, among other things, at how many people like, comment on, share and save a post and how quickly, and at how often people have interacted with you in the past few weeks. How often you post isn’t one of those signals.</p>
<h2>Why posting daily can hurt</h2>
<p>If every post gets few reactions, that tells Instagram people don’t find it interesting. And when you post under pressure, quality drops, and people quickly learn to scroll past you.</p>
<h2>What to do instead</h2>
<ul><li><b>Fewer, better posts.</b> Two or three posts a week that someone wants to save or send to a friend beat seven nobody looks at.</li><li><b>Reply to every comment and message,</b> and fast. Conversation is a signal, and it’s how an enquiry turns into work.</li><li><b>Ask something specific.</b> “Which is harder for you, X or Y?” gets more replies than “Get in touch!”.</li><li><b>Content people save:</b> lists, tips, before-and-after comparisons.</li><li><b>Track messages and enquiries, not just likes.</b> Likes don’t pay the bills.</li></ul>
<h2>How to tell if it’s working</h2>
<p>Once a month, look at which posts brought a message, a call or a visit to your site. Make more of those and fewer of the ones that bring nothing.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Social media</span></p><h1 class="t-h2">3 types of posts that actually bring small businesses clients</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">Pretty photos and holiday greetings collect likes. Enquiries come from posts that show your work, answer questions and prove you can be trusted.</p></header><div class="zip-prose">
<h2>1. Behind the scenes: before and after, or how it’s made</h2>
<p>People buy the result, but they trust the process. Show a flat before and after painting, a haircut in three steps, a repair from fault to fix. A short video or a carousel of three to five photos is enough.</p>
<p><b>End with:</b> “Got a similar problem? Send us a photo in a message.”</p>
<h2>2. An answer to a question customers actually ask</h2>
<p>Every question you’ve heard three times is a post: “How long does…?”, “How much is…?”, “What if…?”. People save and share these, and you can send the link next time someone asks.</p>
<p><b>End with:</b> “Got another question? Write it in the comments.”</p>
<h2>3. Proof: what a customer says</h2>
<p>A Google review, a message from a happy customer or a short quote, always with permission. Add what exactly you did. “You’re great!” is nice, but “You fixed the leak in an hour, on a Sunday” sells.</p>
<p><b>End with:</b> your phone number or a booking link.</p>
<h2>A mix that works</h2>
<p>Not every post has to sell. But every post should show you know what you’re doing. One of each of these three a month already puts you ahead of most competitors.</p>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell"><article style="max-width:68ch;display:grid;gap:26px"><header style="display:grid;gap:16px"><p style="display:flex;gap:10px;align-items:center;font-size:.9375rem"><a href="#/blog" class="text-fg-2 underline hover:text-fg">← Blog</a><span class="text-fg-3">·</span><span class="text-fg-3">Social media</span></p><h1 class="t-h2">Instagram or Facebook: where your customers are actually active</h1><p class="text-fg-3" style="font-size:.875rem"><time datetime="2026-10-01">1 October 2026</time> · 2 min read · zip</p><p class="t-lede">There’s no universal answer. It depends on who your customers are and how they look for you. The good news is you can check it in an afternoon instead of guessing.</p></header><div class="zip-prose">
<h2>1. Ask your customers</h2>
<p>The simplest and most accurate. Ask your next ten customers how they found you and which network they use most. Ten answers tell you more than any statistic.</p>
<h2>2. Look at where enquiries come from</h2>
<p>If people message you on Facebook, and on Instagram you get likes but no messages, you already have your answer. An enquiry is worth more than a follower.</p>
<h2>3. Look at your competitors</h2>
<p>Find three to five businesses in your field and town. Where do they get comments and questions from customers, not just likes? That’s where your customers are too.</p>
<h2>4. Think about how people look for you</h2>
<p>If people look for your service when they need it (a plumber, a repair shop, a lawyer), Google comes first, not social media. If people buy with their eyes (hair, nails, food, interiors), Instagram makes more sense.</p>
<h2>Our advice for small businesses</h2>
<ul><li>One network you run regularly beats two you run now and then.</li><li>Before any network, sort out your Google Business profile. That’s where people look when they’re ready to buy.</li><li>You can post the same content on both, but reply where people actually write.</li></ul>

<main id="main" class="pt-32 pb-20 sm:pt-40 sm:pb-28"><div class="shell" style="display:grid;gap:44px"><header style="display:grid;gap:16px;max-width:62ch"><p class="pill-eyebrow">Blog</p><h1 class="t-h2">Blog</h1><p class="t-lede">Short, practical posts on how small businesses get enquiries: Google profiles, websites, ads and social media.</p><nav aria-label="Categories" style="display:flex;flex-wrap:wrap;gap:8px"><a href="#cat-seo" class="chip" style="text-decoration:none">SEO</a><a href="#cat-ads" class="chip" style="text-decoration:none">Google Ads</a><a href="#cat-web" class="chip" style="text-decoration:none">Websites</a><a href="#cat-social" class="chip" style="text-decoration:none">Social media</a></nav></header><section id="cat-seo" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">SEO</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/blog/google-business-profile-mistakes" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">7 Google profile mistakes that stop customers finding you</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Your Google profile is often the first thing people see about your business, before your website and before they call. These are the mistakes that most often hold small businesses back, and how to fix them in an afternoon.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/why-google-cant-find-your-website" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Why people can’t find you on Google even though you have a website</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">The site exists, you pay for the domain and hosting, and when you type your service into Google everyone shows up except you. The reason is almost always one of these five.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/how-long-until-my-site-shows-up-on-google" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">How long it really takes for your website to show up on Google</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">You’ve launched your site and you’re waiting. Two different things get mixed up here: when Google includes you at all, and when people actually find you.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li></ul></section><section id="cat-ads" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">Google Ads</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/blog/google-ads-spending-but-phone-not-ringing" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Why Google Ads is spending your budget and the phone isn’t ringing</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Money goes out every day, clicks add up, and nobody calls. For small businesses the problem is rarely the ad itself. It’s usually the settings and what happens after the click.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/how-much-to-spend-on-google-ads-per-month" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">How much a small business should spend on Google Ads per month</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">There’s no single figure that fits everyone. But there is a simple way to work out what you need, instead of picking 100 or 500 euros at random.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/google-ads-or-seo-what-first" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Google Ads or SEO: what to do first on a limited budget</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Ads work from day one and stop the moment you stop paying. SEO is slow, but it stays. When the budget is small, the order matters more than the choice.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li></ul></section><section id="cat-web" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">Websites</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/blog/do-i-need-a-website-if-i-have-facebook" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">I have Facebook. Do I even need a website?</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Short answer: sometimes you don’t. But if people look for you on Google, a Facebook page on its own usually isn’t enough. Here’s how to decide.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/redesign-or-new-website" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Website redesign or a new site: how to decide</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Your website doesn’t bring enquiries and you know something has to change. The only question is: fix what you have, or start over?</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/site-looks-good-but-brings-no-enquiries" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Why your website looks good but brings no enquiries or bookings</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">The site looks great, everyone likes it, and nobody gets in touch. Looks are only part of it. A visitor decides in a few seconds whether to contact you, and usually gives up over small things.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/what-a-business-website-must-show-by-law-croatia" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">What every business website in Croatia must show by law</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Most small businesses don’t have all the details the rules require on their site. It’s easy to fix, but first you need to know what exactly has to be there.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/how-much-should-a-website-cost-2026" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">How much a website should really cost you in 2026</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Website prices in Croatia range from a few hundred to a few thousand euros. The difference isn’t just the design, it’s what you get and what you pay later.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li></ul></section><section id="cat-social" class="scroll-mt-24" style="display:grid;gap:16px"><h2 class="t-h3" style="font-size:1.375rem">Social media</h2><ul style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px"><li><a href="#/blog/why-posting-every-day-doesnt-help" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Why posting every day doesn’t help if nobody comments</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">More posts don’t mean more people. If nobody reacts, each new post reaches fewer people, and you spend time you could put into something that works.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/3-types-of-posts-that-bring-clients" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">3 types of posts that actually bring small businesses clients</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">Pretty photos and holiday greetings collect likes. Enquiries come from posts that show your work, answer questions and prove you can be trusted.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li><li><a href="#/blog/instagram-or-facebook-where-are-your-customers" class="card" style="display:grid;gap:10px;padding:24px;height:100%"><span class="text-fg-3" style="font-size:.8125rem">2 min read</span><span style="font-size:1.1875rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--color-fg)">Instagram or Facebook: where your customers are actually active</span><span class="text-fg-2" style="line-height:1.6;font-size:.9375rem">There’s no universal answer. It depends on who your customers are and how they look for you. The good news is you can check it in an afternoon instead of guessing.</span><span class="text-fg" style="font-size:.9375rem;text-decoration:underline">Read</span></a></li></ul></section></div></main>

<script>
/* zip — the site's behaviour without React: pages, menu, FAQ, popups, form. */
(() => {
  const app = document.getElementById("app");
  const pages = {};
  document.querySelectorAll("template[data-route]").forEach((t) => (pages[t.dataset.route] = t));

  /* Pages live in <template data-route> blocks; "#/hr#faq" = page /hr, section #faq. */
  let current = null;
  function render() {
    const h = location.hash;
    if (h && !h.startsWith("#/")) {
      // plain in-page anchor (#contact) or, on /work, a project popup (#grbic-doo)
      if (!current) show("/");
      openWork(h.slice(1));
      return;
    }
    const [path, anchor] = (h ? h.slice(1) : "/").split("#");
    const switched = show(pages[path] ? path : "/");
    if (anchor) {
      if (switched) scrollTo(0, 0);
      if (!openWork(anchor)) document.getElementById(anchor)?.scrollIntoView();
    } else scrollTo(0, 0);
  }
  function show(path) {
    if (current === path) return false;
    current = path;
    const t = pages[path];
    app.replaceChildren(t.content.cloneNode(true));
    document.title = t.dataset.title;
    const md = document.querySelector('meta[name="description"]'); if (md && t.dataset.description) md.setAttribute("content", t.dataset.description);
    document.documentElement.lang = t.dataset.lang;
    init(app, t.dataset);
    return true;
  }
  addEventListener("hashchange", render);

  function init(root, L) {
    const $ = (s) => root.querySelector(s);
    const $$ = (s) => [...root.querySelectorAll(s)];

    /* Mobile menu */
    const btn = $('button[aria-controls="nav-menu"]');
    const panel = $("#nav-menu");
    if (btn && panel) {
      const setMenu = (open) => {
        panel.dataset.open = open;
        panel.toggleAttribute("inert", !open);
        btn.setAttribute("aria-expanded", open);
        btn.querySelectorAll("i").forEach((i) => i.classList.toggle("-rotate-45", open));
      };
      btn.onclick = () => setMenu(panel.dataset.open !== "true");
      panel.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => setMenu(false)));
      document.addEventListener("keydown", (e) => e.key === "Escape" && setMenu(false));
      document.addEventListener("pointerdown", (e) => {
        if (!panel.contains(e.target) && !btn.contains(e.target)) setMenu(false);
      });
    }

    /* FAQ: one open at a time, the open one turns white */
    const accs = $$(".acc");
    const setAcc = (acc, open) => {
      acc.dataset.open = open;
      acc.querySelector("button").setAttribute("aria-expanded", open);
      acc.classList.toggle("border-transparent", open);
      acc.classList.toggle("bg-fg", open);
      acc.classList.toggle("text-void", open);
      acc.classList.toggle("border-line", !open);
      acc.classList.toggle("bg-card-hi/60", !open);
      acc.classList.toggle("text-fg", !open);
      const plus = acc.querySelector(".acc-plus");
      plus.classList.toggle("bg-black/10", open);
      plus.classList.toggle("bg-white/10", !open);
      const p = acc.querySelector(".acc-panel p");
      p.classList.toggle("text-black/65", open);
      p.classList.toggle("text-fg-2", !open);
    };
    accs.forEach((acc) =>
      acc.querySelector("button").addEventListener("click", () => {
        const wasOpen = acc.dataset.open === "true";
        accs.forEach((a) => setAcc(a, false));
        if (!wasOpen) setAcc(acc, true);
      }),
    );

    /* Tilted work tiles: tap straightens one and shows its "Details" link */
    const tiles = $$(".tile");
    const UP = "[transform:translateY(-10px)_scale(1.07)]";
    const DOWN = ["[transform:rotateX(14deg)_rotateZ(var(--rot))]", "[@media(hover:hover)]:hover:[transform:translateY(-6px)_rotateZ(0deg)_scale(1.03)]"];
    tiles.forEach((tile, i) => {
      tile.querySelector("button").addEventListener("click", () => {
        const wasUp = tile.classList.contains(UP);
        tiles.forEach((t, j) => {
          const up = t === tile && !wasUp;
          t.classList.toggle(UP, up);
          DOWN.forEach((c) => t.classList.toggle(c, !up));
          t.style.zIndex = up ? 20 : j + 1;
          t.querySelector("button").setAttribute("aria-pressed", up);
          t.querySelector("[data-tile-link]").hidden = !up;
        });
      });
    });

    /* Contact: "Rather have a call?" panel on mobile */
    const callBtn = $('button[aria-controls="call-panel"]');
    const callPanel = $("#call-panel");
    if (callBtn && callPanel) {
      callBtn.onclick = () => {
        const open = callPanel.classList.contains("hidden");
        callPanel.classList.toggle("hidden", !open);
        callPanel.classList.toggle("block", open);
        callBtn.setAttribute("aria-expanded", open);
        callBtn.querySelector("span[aria-hidden]")?.classList.toggle("rotate-45", open);
      };
    }

    /* Contact form → Formspree */
    const form = $("#contact form");
    if (form) {
      const submit = form.querySelector('button[type="submit"]');
      const submitLabel = submit.firstChild.textContent;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        form.querySelectorAll("[data-err]").forEach((x) => x.remove());
        const data = new FormData(form);
        const errs = {};
        for (const k of ["name", "email", "message"]) {
          const v = String(data.get(k) || "").trim();
          if (!v) errs[k] = L.required;
          else if (k === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) errs[k] = L.invalidEmail;
        }
        for (const [k, msg] of Object.entries(errs)) {
          const f = form.querySelector(`[name="${k}"]`);
          f.setAttribute("aria-invalid", "true");
          f.insertAdjacentHTML("afterend", `<p data-err id="${k}-error" class="mt-2 text-sm text-fg">${msg}</p>`);
          f.setAttribute("aria-describedby", `${k}-error`);
        }
        const first = Object.keys(errs)[0];
        if (first) return form.querySelector(`[name="${first}"]`).focus();
        submit.disabled = true;
        submit.firstChild.textContent = L.sending;
        try {
          const res = await fetch(form.dataset.action, { method: "POST", body: data, headers: { Accept: "application/json" } });
          if (!res.ok) throw 0;
          form.outerHTML = `<p role="status" class="mt-5 text-[1.0625rem] leading-relaxed">${L.success}</p>`;
        } catch {
          submit.disabled = false;
          submit.firstChild.textContent = submitLabel;
          form.insertAdjacentHTML("beforeend", `<p data-err role="alert" class="text-sm text-fg">${L.errorServer}</p>`);
        }
      });
    }

    /* Sticky WhatsApp pill: after the hero, hidden while another [data-cta] block is on screen */
    const pill = $(".sticky-cta");
    if (pill) {
      let pastHero = false;
      const visible = new Set();
      const sync = () => {
        const s = pastHero && visible.size === 0;
        pill.dataset.show = s;
        pill.setAttribute("aria-hidden", !s);
        pill.tabIndex = s ? 0 : -1;
      };
      const onScroll = () => {
        if (!root.contains(pill)) return removeEventListener("scroll", onScroll);
        pastHero = scrollY > innerHeight * 0.85;
        sync();
      };
      addEventListener("scroll", onScroll, { passive: true });
      const io = new IntersectionObserver(
        (es) => { es.forEach((e) => (e.isIntersecting ? visible.add(e.target) : visible.delete(e.target))); sync(); },
        { threshold: 0, rootMargin: "0px 0px -80px 0px" },
      );
      $$("[data-cta]").forEach((el) => io.observe(el));
      onScroll();
    }

    /* "A few seconds" ring fills once it scrolls into view */
    $$(".ring-fill").forEach((c) => {
      const io = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { c.classList.add("is-on"); io.disconnect(); }
      }, { threshold: 0.6 });
      io.observe(c.closest("svg"));
    });

    /* /work: each card opens its <dialog data-work> popup; arrows step through */
    const dialogs = $$("dialog[data-work]");
    $$("main ul > li > button").forEach((b, i) => b.addEventListener("click", () => openWork(dialogs[i]?.dataset.work)));
    dialogs.forEach((d, i) => {
      const [prev, next] = d.querySelectorAll("span.ml-auto button");
      const step = (dir) => openWork(dialogs[(i + dir + dialogs.length) % dialogs.length].dataset.work);
      prev?.addEventListener("click", () => step(-1));
      next?.addEventListener("click", () => step(1));
      d.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") step(1);
        if (e.key === "ArrowLeft") step(-1);
      });
      d.querySelector('button[aria-label="Close"],button[aria-label="Zatvori"]').onclick = () => d.close();
      d.addEventListener("click", (e) => e.target === d && d.close());
      d.addEventListener("close", () => {
        if (!app.querySelector("dialog[open]")) {
          document.body.style.overflow = "";
          history.replaceState(null, "", "#" + current);
        }
      });
    });

    glass(root);
  }

  function openWork(slug) {
    const d = slug && app.querySelector(`dialog[data-work="${CSS.escape(slug)}"]`);
    if (!d) return false;
    app.querySelectorAll("dialog[open]").forEach((x) => x !== d && x.close());
    if (!d.open) d.showModal();
    d.querySelector("p[tabindex]")?.focus({ preventScroll: true });
    document.body.style.overflow = "hidden";
    history.replaceState(null, "", "#" + current + "#" + slug);
    return true;
  }

  /* Liquid-glass edge refraction — Chromium only; Safari keeps the frosted .glass look */
  const cache = new Map();
  let uid = 0;
  function lensMap(w, h, r, band) {
    const key = `${w}x${h}x${r}x${band}`;
    if (cache.has(key)) return cache.get(key);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    if (!ctx) return "";
    const im = ctx.createImageData(w, h), d = im.data, cx = w / 2, cy = h / 2;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x + 0.5 - cx, py = y + 0.5 - cy;
      const qx = Math.abs(px) - (cx - r), qy = Math.abs(py) - (cy - r);
      const dist = r - (Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0));
      let nx = 0, ny = 0;
      if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; nx = (qx / l) * Math.sign(px); ny = (qy / l) * Math.sign(py); }
      else if (qx > qy) nx = Math.sign(px);
      else ny = Math.sign(py);
      const m = dist < band ? Math.pow(1 - Math.max(dist, 0) / band, 2) : 0;
      const i = (y * w + x) * 4;
      d[i] = 128 - nx * m * 127; d[i + 1] = 128 - ny * m * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    ctx.putImageData(im, 0, 0);
    const url = c.toDataURL();
    cache.set(key, url);
    return url;
  }
  function glass(root) {
    const ua = navigator.userAgent;
    if (!/Chrome\/\d+/.test(ua) || /Firefox|CriOS|FxiOS|EdgiOS/.test(ua)) return;
    if (matchMedia("(prefers-reduced-transparency: reduce)").matches) return;
    const NS = "http://www.w3.org/2000/svg";
    let svg = document.getElementById("glass-fx");
    if (!svg) {
      svg = document.createElementNS(NS, "svg");
      svg.id = "glass-fx";
      svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.setAttribute("aria-hidden", "true");
      svg.style.position = "absolute";
      svg.appendChild(document.createElementNS(NS, "defs"));
      document.body.appendChild(svg);
    }
    const defs = svg.firstChild;
    const apply = (el) => {
      const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
      if (w < 8 || h < 8) return;
      const r = Math.min(h / 2, parseFloat(getComputedStyle(el).borderTopLeftRadius) || h / 2);
      const id = el.dataset.fid || (el.dataset.fid = `glass-f${++uid}`);
      let f = document.getElementById(id);
      if (!f) { f = document.createElementNS(NS, "filter"); f.id = id; f.setAttribute("color-interpolation-filters", "sRGB"); defs.appendChild(f); }
      const map = lensMap(w, h, Math.round(r), Math.min(22, Math.round(h * 0.42)));
      if (!map) return;
      f.innerHTML =
        `<feImage href="${map}" x="0" y="0" width="${w}" height="${h}" result="map"/>` +
        `<feDisplacementMap in="SourceGraphic" in2="map" scale="${Math.round(Math.min(46, h * 0.7))}" xChannelSelector="R" yChannelSelector="G"/>`;
      el.style.backdropFilter = `url(#${id}) blur(1.2px) saturate(1.7) brightness(1.08)`;
    };
    const ro = new ResizeObserver((es) => es.forEach((e) => apply(e.target)));
    root.querySelectorAll("[data-refract]").forEach((el) => ro.observe(el));
  }

  render();
})();

</script>
